<main class="page-body">
  <div class="container" style="max-width:920px">
    <div class="topic-head">
      <p class="text-muted mono" style="font-size:var(--fs-sm)" id="topic-breadcrumb">forum / ...</p>
      <div class="topic-head-top">
        <div>
          <h1 id="topic-title">Загрузка...</h1>
          <div class="topic-tags" id="topic-tags"></div>
        </div>
        <div class="topic-toolbar" id="topic-toolbar">
          <button class="btn btn-secondary btn-sm" id="bookmark-btn">🔖 В закладки</button>
          <button class="btn btn-secondary btn-sm hidden" id="pin-btn">📌 Закрепить</button>
          <button class="btn btn-secondary btn-sm hidden" id="close-btn">🔒 Закрыть</button>
          <button class="btn btn-danger btn-sm hidden" id="delete-topic-btn">Удалить</button>
        </div>
      </div>
      <div class="text-muted" style="font-size:var(--fs-xs);margin-top:8px" id="topic-meta"></div>
    </div>

    <div class="card post-thread" id="posts-container">
      <div class="skeleton" style="height:140px;margin:16px"></div>
    </div>

    <div class="reply-box" id="reply-box">
      <h3 style="font-size:var(--fs-md)">Ответить</h3>
      <div class="editor-root" id="reply-editor-root">
        <div class="editor-toolbar">
          <button data-action="bold" title="Жирный"><b>B</b></button>
          <button data-action="italic" title="Курсив"><i>I</i></button>
          <button data-action="underline" title="Подчёркнутый"><u>U</u></button>
          <button data-action="strike" title="Зачёркнутый"><s>S</s></button>
          <div class="divider"></div>
          <button data-action="code" title="Код">&lt;/&gt;</button>
          <button data-action="codeblock" title="Блок кода">{ }</button>
          <button data-action="quote" title="Цитата">❝</button>
          <button data-action="spoiler" title="Спойлер">👁</button>
          <div class="divider"></div>
          <button data-action="link" title="Ссылка">🔗</button>
          <button data-action="image" title="Изображение">🖼</button>
          <button data-action="list" title="Список">☰</button>
          <button data-action="table" title="Таблица">▦</button>
          <button data-action="emoji" title="Emoji">🙂</button>
          <label class="icon-btn" style="width:32px;height:32px" title="Прикрепить файл">
            📎<input type="file" class="editor-file-input" accept="image/*" multiple style="display:none">
          </label>
        </div>
        <div class="editor-panes">
          <textarea class="editor-textarea" placeholder="Напишите ответ в Markdown..."></textarea>
          <div class="editor-preview post-content"></div>
        </div>
        <div class="editor-drop-hint">Отпустите, чтобы загрузить изображение</div>
        <div class="editor-footer">
          <span class="text-muted mono" style="font-size:var(--fs-xs)">Markdown поддерживается · черновик сохраняется автоматически</span>
          <button class="btn btn-primary" id="submit-reply-btn">Отправить ответ</button>
        </div>
      </div>
    </div>
  </div>
</main>
