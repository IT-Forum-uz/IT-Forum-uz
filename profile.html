<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<link rel="icon" href="assets/icons/favicon.svg">
<link rel="stylesheet" href="assets/css/variables.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/profile.css">
</head>
<body>
<header class="site-header">
  <div class="container">
    <a href="index.html" class="brand"><span class="dot"></span>Dev<span class="accent">Port</span></a>
    <nav class="main-nav"><a href="index.html">Главная</a><a href="forum.html">Форум</a><a href="members.html">Участники</a><a href="search.html">Поиск</a></nav>
    <div class="header-search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><input id="header-search-input" type="text" placeholder="Поиск..."></div>
    <div class="header-actions">
      <button class="icon-btn" id="theme-toggle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
      <div id="nav-guest" class="flex gap-2"><a href="login.html" class="btn btn-ghost btn-sm">Войти</a><a href="register.html" class="btn btn-primary btn-sm">Регистрация</a></div>
      <div id="nav-user" class="flex items-center gap-3 hidden">
        <a href="notifications.html" class="icon-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg><span class="badge-dot hidden" id="notif-badge"></span></a>
        <a href="messages.html" class="icon-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg></a>
        <a id="nav-profile-link" href="profile.html" class="flex items-center gap-2"><img id="nav-avatar" class="avatar avatar-sm" src="assets/images/default-avatar.svg" alt=""><span id="nav-username" style="font-size:var(--fs-sm)"></span></a>
        <a href="settings.html" class="icon-btn" title="Настройки"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.6 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg></a>
        <a id="nav-admin-link" href="admin/dashboard.html" class="icon-btn hidden"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l8 4v6c0 5-3.5 8-8 10-4.5-2-8-5-8-10V6z"/></svg></a>
        <a href="#" id="logout-btn" class="icon-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg></a>
      </div>
    </div>
  </div>
</header>

<main class="page-body">
  <div class="container">
    <div class="profile-cover" id="profile-cover">
      <button class="btn btn-secondary btn-sm profile-cover-edit hidden" id="edit-cover-btn">Изменить обложку</button>
      <input type="file" id="cover-file-input" accept="image/*" class="hidden">
    </div>
    <div class="profile-header">
      <div class="profile-avatar-wrap">
        <img class="avatar avatar-xl" id="profile-avatar" src="assets/images/default-avatar.svg" alt="">
        <button class="avatar-edit-btn hidden" id="edit-avatar-btn">✎</button>
        <input type="file" id="avatar-file-input" accept="image/*" class="hidden">
      </div>
      <div class="profile-name-row">
        <h1 id="profile-name">Загрузка...</h1>
        <p class="text-muted mono" style="font-size:var(--fs-sm)" id="profile-joined"></p>
      </div>
      <div>
        <button class="btn btn-secondary hidden" id="edit-profile-btn">Редактировать профиль</button>
        <button class="btn btn-primary hidden" id="follow-btn">+ Подписаться</button>
        <button class="btn btn-secondary hidden" id="message-btn">✉ Написать</button>
      </div>
    </div>

    <div style="padding:0 var(--sp-5)">
      <p class="profile-bio" id="profile-bio"></p>
      <div class="profile-links" id="profile-links"></div>
      <div class="profile-skills" id="profile-skills"></div>

      <div class="profile-stats-grid">
        <div class="card profile-stat-card"><b id="stat-topics">0</b><span>Тем</span></div>
        <div class="card profile-stat-card"><b id="stat-posts">0</b><span>Сообщений</span></div>
        <div class="card profile-stat-card"><b id="stat-reputation">0</b><span>Репутация</span></div>
        <div class="card profile-stat-card"><b id="stat-followers">0</b><span>Подписчиков</span></div>
      </div>

      <div class="profile-tabs">
        <button class="active" data-tab="topics">Темы</button>
        <button data-tab="posts">Сообщения</button>
        <button data-tab="bookmarks">Закладки</button>
      </div>
      <div class="card" id="profile-tab-content"></div>
    </div>
  </div>
</main>

<!-- Edit profile modal -->
<div class="modal-overlay" id="edit-profile-modal">
  <div class="glass-card modal-box">
    <h3 style="margin-bottom:16px">Редактировать профиль</h3>
    <form id="edit-profile-form">
      <div class="form-group"><label class="form-label">Имя</label><input class="form-input" id="edit-name"></div>
      <div class="form-group"><label class="form-label">О себе</label><textarea class="form-textarea" id="edit-bio" maxlength="300"></textarea></div>
      <div class="form-group"><label class="form-label">Навыки (через запятую)</label><input class="form-input" id="edit-skills" placeholder="JavaScript, React, Node.js"></div>
      <div class="form-group"><label class="form-label">Сайт</label><input class="form-input" id="edit-website" placeholder="https://"></div>
      <div class="form-group"><label class="form-label">GitHub</label><input class="form-input" id="edit-github" placeholder="username"></div>
      <div class="form-group"><label class="form-label">Telegram</label><input class="form-input" id="edit-telegram" placeholder="username"></div>
      <div class="form-group"><label class="form-label">Discord</label><input class="form-input" id="edit-discord" placeholder="username"></div>
      <div class="flex gap-3" style="margin-top:8px">
        <button type="submit" class="btn btn-primary btn-block">Сохранить</button>
        <button type="button" class="btn btn-ghost btn-block" id="close-edit-modal">Отмена</button>
      </div>
    </form>
  </div>
</div>

<div id="toast-root"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script src="firebase/firebase-config.js"></script>
<script src="assets/js/utils.js"></script>
<script src="assets/js/firestore-service.js"></script>
<script src="assets/js/nav.js"></script>
<script src="assets/js/profile.js"></script>
</body>
</html>
